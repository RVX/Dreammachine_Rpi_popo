# Disables WiFi power-save on the onboard brcmfmac chip. Without this,
# periodic "associating -> disconnected -> scanning" cycles occur every
# few minutes (confirmed via dmesg "brcmfmac: ... power save enabled" and
# matching NetworkManager supplicant-state churn), which network_watchdog.sh
# logs as connectivity blips even on a healthy AP/signal. Deploy to
# /etc/NetworkManager/conf.d/wifi-powersave-off.conf on every unit, then
# `sudo systemctl restart NetworkManager` (or reboot) to apply.
[connection]
wifi.powersave = 2
